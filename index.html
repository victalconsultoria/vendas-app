<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Representante - FLVX</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/papaparse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #004a99; --secondary: #f8f9fa; --accent: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #eef2f7; color: #333; }
        header { background: var(--primary); color: white; padding: 1rem; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .container { max-width: 800px; margin: 20px auto; padding: 10px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h3 { margin-top: 0; color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 10px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; transition: 0.3s; }
        .btn:hover { opacity: 0.9; }
        .btn-add { background: var(--accent); padding: 8px; margin-top: 5px; width: auto; min-width: 120px; }
        .produto-resultado { border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-top: 10px; background: #fff; }
        .item-carrinho { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .total-container { text-align: right; font-size: 18px; font-weight: bold; color: var(--primary); margin-top: 15px; }
    </style>
</head>
<body>

<header>
    <h1>FLVX - Sistema de Cotação</h1>
</header>

<div class="container">
    <div class="card">
        <h3>1. Dados do Cliente</h3>
        <input type="text" id="cliente_rs" placeholder="Razão Social / Nome Fantasia">
        <input type="text" id="cliente_cnpj" placeholder="CNPJ">
        <input type="text" id="cliente_cidade" placeholder="Cidade / UF">
        <select id="perfil_fiscal">
            <option value="">Selecione a Classificação Fiscal</option>
            <option value="SP REVENDA SN">SP REVENDA - Simples Nacional</option>
            <option value="SP REVENDA LP">SP REVENDA - Lucro Presumido</option>
            <option value="SP REVENDA LR">SP REVENDA - Lucro Real</option>
            <option value="MG REVENDA SN">MG REVENDA - Simples Nacional</option>
            <option value="SP ATACADO SN">SP ATACADO - Simples Nacional</option>
            <option value="CONSTRUTORA">CONSTRUTORA</option>
        </select>
        <input type="text" id="prazo_pgto" placeholder="Prazo de Pagamento (ex: 28/56 dias)">
    </div>

    <div class="card">
        <h3>2. Consultar Preços</h3>
        <input type="text" id="busca" placeholder="Digite código ou descrição..." onkeyup="buscar()">
        <div id="resultados"></div>
    </div>

    <div class="card">
        <h3>3. Resumo da Cotação</h3>
        <div id="carrinho_lista"><em>Selecione produtos acima.</em></div>
        <div class="total-container" id="total_geral">Total: R$ 0,00</div>
        <hr>
        <textarea id="obs" placeholder="Observações (ex: Frete por conta do cliente...)"></textarea>
        <button class="btn" onclick="gerarPDF()">Gerar PDF e Enviar</button>
    </div>
</div>

<script>
    let db = [];
    let carrinho = [];
    const LINK_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR2ZD5mHtSutLQKXCW5Ps1zG-EHdRs_zFdBBjOHR9VRK9Ag57iNbAFsb7799stO1w/pub?output=csv';

    function inicializar() {
        Papa.parse(LINK_CSV, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: (res) => { db = res.data; console.log("Dados carregados:", db.length); },
            error: () => { alert("Erro ao carregar base. Verifique a conexão."); }
        });
    }

    function buscar() {
        const termo = document.getElementById('busca').value.toUpperCase();
        const resDiv = document.getElementById('resultados');
        resDiv.innerHTML = "";
        if(termo.length < 2) return;

        const filtro = db.filter(p => 
            (p.Codigo && p.Codigo.toUpperCase().includes(termo)) || 
            (p.Descricao && p.Descricao.toUpperCase().includes(termo))
        ).slice(0, 5);

        filtro.forEach(p => {
            const div = document.createElement('div');
            div.className = 'produto-resultado';
            div.innerHTML = `
                <strong>${p.Codigo}</strong> - ${p.Descricao}<br>
                <small>IPI: ${p.IPI || '0'}% | Preço Base: R$ ${p.PrecoNF || '0,00'}</small><br>
                <input type="number" id="qtd_${p.Codigo}" value="1" min="1" style="width: 70px; display:inline-block; margin-right:10px;">
                <button class="btn btn-add" onclick="add('${p.Codigo}')">Adicionar</button>
            `;
            resDiv.appendChild(div);
        });
    }

    function add(codigo) {
        const perfil = document.getElementById('perfil_fiscal').value;
        if(!perfil) { alert("Selecione o perfil fiscal no Passo 1!"); return; }

        const prod = db.find(p => p.Codigo === codigo);
        const qtd = parseFloat(document.getElementById(`qtd_${codigo}`).value);
        
        // Limpeza de string para número (remove R$ e converte vírgula em ponto)
        let precoLimpo = prod[perfil].replace('R$', '').replace('.', '').replace(',', '.').trim();
        const precoNum = parseFloat(precoLimpo) || 0;

        carrinho.push({
            cod: prod.Codigo,
            desc: prod.Descricao,
            qtd: qtd,
            precoUnit: precoNum,
            subtotal: qtd * precoNum
        });
        
        document.getElementById('busca').value = "";
        document.getElementById('resultados').innerHTML = "";
        renderCarrinho();
    }

    function renderCarrinho() {
        const lista = document.getElementById('carrinho_lista');
        let total = 0;
        lista.innerHTML = carrinho.map((i, index) => {
            total += i.subtotal;
            return `
            <div class="item-carrinho">
                <span>${i.qtd}x <strong>${i.cod}</strong></span>
                <span>${i.desc.substring(0,25)}...</span>
                <span>R$ ${i.subtotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>
            </div>`;
        }).join('');
        document.getElementById('total_geral').innerText = `Total: R$ ${total.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
    }

    function gerarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        let y = 20;

        doc.setFontSize(18);
        doc.setTextColor(0, 74, 153);
        doc.text("ORÇAMENTO - FLVX", 10, y);
        
        doc.setFontSize(10);
        doc.setTextColor(0, 0, 0);
        y += 12;
        doc.text(`Cliente: ${document.getElementById('cliente_rs').value}`, 10, y);
        y += 6;
        doc.text(`CNPJ: ${document.getElementById('cliente_cnpj').value} | Cidade: ${document.getElementById('cliente_cidade').value}`, 10, y);
        y += 6;
        doc.text(`Prazo: ${document.getElementById('prazo_pgto').value} | Canal: ${document.getElementById('perfil_fiscal').value}`, 10, y);
        
        y += 10;
        doc.line(10, y, 200, y);
        y += 10;

        doc.setFont(undefined, 'bold');
        doc.text("Item", 10, y);
        doc.text("Qtd", 130, y);
        doc.text("Unit.", 155, y);
        doc.text("Total", 185, y);
        y += 7;
        doc.setFont(undefined, 'normal');

        let totalFinal = 0;
        carrinho.forEach(item => {
            totalFinal += item.subtotal;
            doc.text(`${item.cod} - ${item.desc.substring(0, 45)}`, 10, y);
            doc.text(`${item.qtd}`, 130, y);
            doc.text(`${item.precoUnit.toFixed(2)}`, 155, y);
            doc.text(`${item.subtotal.toFixed(2)}`, 185, y);
            y += 8;
            if(y > 270) { doc.addPage(); y = 20; }
        });

        y += 10;
        doc.setFontSize(14);
        doc.text(`VALOR TOTAL DA COTAÇÃO: R$ ${totalFinal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`, 10, y);
        
        y += 15;
        doc.setFontSize(10);
        doc.text("Observações:", 10, y);
        y += 6;
        doc.text(document.getElementById('obs').value, 10, y, { maxWidth: 180 });

        doc.save(`FLVX_${document.getElementById('cliente_rs').value}.pdf`);
    }

    window.onload = inicializar;
</script>

</body>
</html>

</body>

</html>
