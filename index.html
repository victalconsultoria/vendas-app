<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLVX - Painel de Vendas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/papaparse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #004a99; --accent: #28a745; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--bg); color: #333; }
        header { background: var(--primary); color: white; padding: 1.2rem; text-align: center; font-weight: bold; }
        .container { max-width: 850px; margin: 15px auto; padding: 10px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h3 { margin: 0 0 15px 0; color: var(--primary); font-size: 1.1rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .btn { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-add { background: var(--accent); width: auto; padding: 10px 25px; margin-top: 10px; }
        .produto-resultado { border: 1px solid #e5e7eb; padding: 15px; margin-top: 10px; background: #fff; border-radius: 8px; border-left: 5px solid var(--primary); }
        .item-carrinho { display: grid; grid-template-columns: 1fr auto; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        #status { font-size: 0.85rem; text-align: center; margin-bottom: 10px; color: #004a99; font-weight: bold; background: #dbeafe; padding: 8px; border-radius: 8px; }
    </style>
</head>
<body>

<header>FLVX - SISTEMA DE COTAÇÃO</header>

<div class="container">
    <div id="status">⏳ Sincronizando com base de dados FLVX...</div>

    <div class="card">
        <h3>1. Configuração Fiscal</h3>
        <select id="perfil_fiscal">
            <option value="">Selecione o Canal de Venda...</option>
            <option value="SP REVENDA SN">SP REVENDA SN</option>
            <option value="SP REVENDA LP">SP REVENDA LP</option>
            <option value="SP REVENDA LR">SP REVENDA LR</option>
            <option value="MG REVENDA SN">MG REVENDA SN</option>
            <option value="MG REVENDA LP">MG REVENDA LP</option>
            <option value="MG REVENDA LR">MG REVENDA LR</option>
            <option value="SP ATACADO SN">SP ATACADO SN</option>
            <option value="SP ATACADO LP">SP ATACADO LP</option>
            <option value="SP ATACADO LR">SP ATACADO LR</option>
            <option value="MG ATACADO SN">MG ATACADO SN</option>
            <option value="MG ATACADO LP">MG ATACADO LP</option>
            <option value="MG ATACADO LR">MG ATACADO LR</option>
            <option value="CONSTRUTORA">CONSTRUTORA</option>
        </select>
        <input type="text" id="cli_nome" placeholder="Nome do Cliente / Razão Social">
    </div>

    <div class="card">
        <h3>2. Pesquisar por Código ou Nome</h3>
        <input type="text" id="busca" placeholder="Ex: 1020 ou Torneira..." oninput="buscar()">
        <div id="resultados"></div>
    </div>

    <div class="card">
        <h3>3. Orçamento</h3>
        <div id="carrinho_lista"><em>Lista vazia.</em></div>
        <div id="total_display" style="text-align:right; font-weight:bold; font-size:1.4rem; margin: 15px 0;">Total: R$ 0,00</div>
        <textarea id="obs" placeholder="Observações, Prazo e Frete..."></textarea>
        <button class="btn" onclick="gerarPDF()">GERAR PDF</button>
    </div>
</div>

<script>
    let db = [];
    let carrinho = [];
    const LINK_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR2ZD5mHtSutLQKXCW5Ps1zG-EHdRs_zFdBBjOHR9VRK9Ag57iNbAFsb7799stO1w/pub?output=csv';

    window.onload = () => {
        Papa.parse(LINK_CSV, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: (res) => {
                // Filtra para garantir que só pegamos linhas que tenham o Código preenchido (limpa as 3 primeiras linhas)
                db = res.data.filter(linha => {
                    const keys = Object.keys(linha);
                    return linha["Código"] && linha["Código"].trim() !== "" && linha["Código"] !== "Código";
                });
                document.getElementById('status').innerText = `✅ Sucesso! ${db.length} produtos carregados.`;
            }
        });
    };

    function buscar() {
        const termo = document.getElementById('busca').value.trim().toUpperCase();
        const resDiv = document.getElementById('resultados');
        resDiv.innerHTML = "";

        if (termo.length < 2) return;

        // Busca flexível ignorando espaços
        const filtro = db.filter(p => {
            const cod = String(p["Código"] || "").toUpperCase();
            const desc = String(p["Descrição do produto"] || "").toUpperCase();
            return cod.includes(termo) || desc.includes(termo);
        }).slice(0, 10);

        if(filtro.length === 0) {
            resDiv.innerHTML = "<small>Nenhum produto encontrado com este termo.</small>";
        }

        filtro.forEach(p => {
            const div = document.createElement('div');
            div.className = 'produto-resultado';
            div.innerHTML = `
                <strong>${p["Código"]}</strong> - ${p["Descrição do produto"]}<br>
                <div style="display:flex; align-items:center; gap:10px; margin-top:10px;">
                    <input type="number" id="qtd_${p["Código"]}" value="1" min="1" style="width:70px; margin:0;">
                    <button class="btn btn-add" onclick="adicionar('${p["Código"]}')">ADICIONAR</button>
                </div>
            `;
            resDiv.appendChild(div);
        });
    }

    function converterPreco(texto) {
        if (!texto) return 0;
        let limpo = texto.toString().replace('R$', '').replace(/\./g, '').replace(',', '.').trim();
        return parseFloat(limpo) || 0;
    }

    function adicionar(codigo) {
        const canal = document.getElementById('perfil_fiscal').value;
        if (!canal) { alert("⚠️ Selecione o Canal de Venda primeiro!"); return; }

        const prod = db.find(p => String(p["Código"]).trim() === String(codigo).trim());
        const qtd = parseFloat(document.getElementById(`qtd_${codigo}`).value) || 1;
        
        const precoUnit = converterPreco(prod[canal]);

        carrinho.push({
            cod: prod["Código"],
            desc: prod["Descrição do produto"],
            qtd: qtd,
            unit: precoUnit,
            total: qtd * precoUnit
        });

        document.getElementById('busca').value = "";
        document.getElementById('resultados').innerHTML = "";
        atualizarCarrinho();
    }

    function atualizarCarrinho() {
        const lista = document.getElementById('carrinho_lista');
        let soma = 0;
        if (carrinho.length === 0) {
            lista.innerHTML = "<em>Lista vazia.</em>";
            return;
        }
        
        lista.innerHTML = carrinho.map(i => {
            soma += i.total;
            return `<div class="item-carrinho">
                <span><strong>${i.qtd}x</strong> ${i.cod} - ${i.desc}</span>
                <span>R$ ${i.total.toLocaleString('pt-BR', {minimumFractionDigits:2})}</span>
            </div>`;
        }).join('');
        document.getElementById('total_display').innerText = `Total: R$ ${soma.toLocaleString('pt-BR', {minimumFractionDigits:2})}`;
    }

    function gerarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        let y = 20;

        doc.setFontSize(16); doc.text("ORÇAMENTO FLVX", 10, y);
        doc.setFontSize(10);
        y += 10; doc.text(`Cliente: ${document.getElementById('cli_nome').value}`, 10, y);
        y += 5; doc.text(`Canal: ${document.getElementById('perfil_fiscal').value}`, 10, y);
        y += 10; doc.line(10, y, 200, y);
        y += 10;

        carrinho.forEach(item => {
            doc.text(`${item.qtd}x ${item.cod} - ${item.desc.substring(0,40)}`, 10, y);
            doc.text(`R$ ${item.total.toFixed(2)}`, 170, y);
            y += 8;
        });

        y += 10;
        doc.text(`TOTAL FINAL: ${document.getElementById('total_display').innerText}`, 10, y);
        doc.save("orcamento_flvx.pdf");
    }
</script>

</body>
</html>
