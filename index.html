<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotações FLVX Hidro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/papaparse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #004a99; --accent: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #eef2f7; color: #333; }
        header { background: var(--primary); color: white; padding: 1rem; text-align: center; }
        .container { max-width: 800px; margin: 10px auto; padding: 10px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h3 { margin-top: 0; color: var(--primary); font-size: 1.1rem; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-add { background: var(--accent); width: auto; padding: 8px 20px; }
        .produto-resultado { border-left: 4px solid var(--primary); padding: 15px; margin-top: 10px; background: #f9f9f9; border-radius: 4px; }
        .item-carrinho { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        #status-base { font-size: 0.8rem; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>

<header>
    <h1>FLVX Materiais</h1>
</header>

<div class="container">
    <div id="status-base">⏳ Carregando base de dados...</div>

    <div class="card">
        <h3>1. Configuração da Venda</h3>
        <select id="perfil_fiscal">
            <option value="">Selecione o Canal/Estado</option>
            <option value="SP REVENDA SN">SP REVENDA SIMPLES NACIONAL</option>
            <option value="SP REVENDA LP">SP REVENDA LUCRO PRESUMIDO</option>
            <option value="SP REVENDA LR">SP REVENDA LUCRO REAL</option>
            <option value="MG REVENDA SN">MG REVENDA SIMPLES NACIONAL</option>
            <option value="MG REVENDA LP">MG REVENDA LUCRO PRESUMIDO</option>
            <option value="MG REVENDA LR">MG REVENDA LUCRO REAL</option>
            <option value="SP ATACADO SN">SP ATACADO SIMPLES NACIONAL</option>
            <option value="SP ATACADO LP">SP ATACADO LUCRO PRESUMIDO</option>
            <option value="SP ATACADO LR">SP ATACADO LUCRO REAL</option>
            <option value="MG ATACADO SN">MG ATACADO SIMPLES NACIONAL</option>
            <option value="MG ATACADO LP">MG ATACADO LUCRO PRESUMIDO</option>
            <option value="MG ATACADO LR">MG ATACADO LUCRO REAL</option>
            <option value="CONSTRUTORA">CONSTRUTORA</option>
        </select>
        <input type="text" id="cliente_rs" placeholder="Razão Social / Nome Fantasia">
        <input type="text" id="cliente_cnpj" placeholder="CNPJ">
        <input type="text" id="cliente_local" placeholder="Cidade / UF">
    </div>

    <div class="card">
        <h3>2. Pesquisar Produtos</h3>
        <input type="text" id="busca" placeholder="Digite Código ou Descrição..." oninput="buscar()">
        <div id="resultados"></div>
    </div>

    <div class="card">
        <h3>3. Lista de Itens</h3>
        <div id="carrinho_lista"></div>
        <div id="total_geral" style="text-align:right; font-weight:bold; font-size:1.2rem; margin-top:10px;">Total: R$ 0,00</div>
        <textarea id="obs" placeholder="Observações e Prazo de Pagamento..."></textarea>
        <button class="btn" onclick="gerarPDF()">Gerar PDF Orçamento</button>
    </div>
</div>

<script>
    let db = [];
    let carrinho = [];
    const LINK_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR2ZD5mHtSutLQKXCW5Ps1zG-EHdRs_zFdBBjOHR9VRK9Ag57iNbAFsb7799stO1w/pub?output=csv';

    // Inicializa carregando a planilha
    window.onload = () => {
        Papa.parse(LINK_CSV, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: (res) => {
                db = res.data;
                document.getElementById('status-base').innerText = `✅ Base atualizada: ${db.length} itens prontos.`;
            }
        });
    };

    function buscar() {
        const termo = document.getElementById('busca').value.trim().toUpperCase();
        const resDiv = document.getElementById('resultados');
        resDiv.innerHTML = "";

        if (termo.length < 2) return;

        // Busca flexível: Código ou Descrição
        const encontrados = db.filter(p => 
            (p.Codigo && p.Codigo.toString().toUpperCase().includes(termo)) || 
            (p.Descricao && p.Descricao.toUpperCase().includes(termo))
        ).slice(0, 8);

        encontrados.forEach(p => {
            const div = document.createElement('div');
            div.className = 'produto-resultado';
            div.innerHTML = `
                <strong>${p.Codigo}</strong> - ${p.Descricao}<br>
                <small>Preço Base NF: R$ ${p.PrecoNF || '0,00'}</small><br>
                <div style="display:flex; gap:10px; margin-top:8px;">
                    <input type="number" id="qtd_${p.Codigo}" value="1" style="width:70px; margin:0;">
                    <button class="btn btn-add" onclick="adicionar('${p.Codigo}')">Adicionar</button>
                </div>
            `;
            resDiv.appendChild(div);
        });
    }

    function limparPreco(valor) {
        if (!valor) return 0;
        // Remove R$, pontos de milhar e troca vírgula por ponto
        let limpo = valor.toString().replace('R$', '').replace(/\./g, '').replace(',', '.').trim();
        return parseFloat(limpo) || 0;
    }

    function adicionar(codigo) {
        const canal = document.getElementById('perfil_fiscal').value;
        if (!canal) { alert("Por favor, selecione o Canal/Classificação Fiscal primeiro."); return; }

        const prod = db.find(p => p.Codigo == codigo);
        const qtd = parseFloat(document.getElementById(`qtd_${codigo}`).value) || 1;
        
        // Busca o preço na coluna do canal selecionado
        const precoUnit = limparPreco(prod[canal]);

        carrinho.push({
            cod: prod.Codigo,
            desc: prod.Descricao,
            qtd: qtd,
            unit: precoUnit,
            total: qtd * precoUnit
        });

        document.getElementById('busca').value = "";
        document.getElementById('resultados').innerHTML = "";
        atualizarCarrinho();
    }

    function atualizarCarrinho() {
        const lista = document.getElementById('carrinho_lista');
        let soma = 0;
        lista.innerHTML = carrinho.map(i => {
            soma += i.total;
            return `<div class="item-carrinho">
                <span>${i.qtd}x ${i.cod}</span>
                <span>R$ ${i.total.toLocaleString('pt-BR', {minimumFractionDigits:2})}</span>
            </div>`;
        }).join('');
        document.getElementById('total_geral').innerText = `Total: R$ ${soma.toLocaleString('pt-BR', {minimumFractionDigits:2})}`;
    }

    function gerarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        let y = 20;

        doc.setFontSize(16); doc.text("ORÇAMENTO - FLVX MATERIAIS", 10, y);
        doc.setFontSize(10);
        y += 10; doc.text(`Cliente: ${document.getElementById('cliente_rs').value}`, 10, y);
        y += 5; doc.text(`CNPJ: ${document.getElementById('cliente_cnpj').value} | Local: ${document.getElementById('cliente_local').value}`, 10, y);
        y += 5; doc.text(`Canal Fiscal: ${document.getElementById('perfil_fiscal').value}`, 10, y);
        
        y += 10; doc.line(10, y, 200, y);
        y += 10;
        
        carrinho.forEach(item => {
            doc.text(`${item.qtd}x ${item.cod} - ${item.desc.substring(0,40)}`, 10, y);
            doc.text(`R$ ${item.total.toFixed(2)}`, 170, y);
            y += 8;
        });

        y += 10;
        doc.setFont(undefined, 'bold');
        doc.text(`TOTAL FINAL: ${document.getElementById('total_geral').innerText}`, 10, y);
        y += 10;
        doc.setFont(undefined, 'normal');
        doc.text("Obs: " + document.getElementById('obs').value, 10, y, {maxWidth: 180});

        doc.save("Orcamento_FLVX.pdf");
    }
</script>

</body>
</html>
